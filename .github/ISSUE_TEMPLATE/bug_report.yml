name: Bug report
description: Report a reproducible tulpa defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, database passwords,
        private messages, prompts, screenshots of private content, and audio before posting.
        Security vulnerabilities belong in a private Security Advisory.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observable behavior and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic steps, request, or test.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or diagnostics
      description: Paste only the relevant lines after removing secrets and private content.
      render: shell

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows 11
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tulpa version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run tulpa?
      options:
        - Packaged app
        - From source (npm run dev / dev:win)
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: List variable names and non-secret values only.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, private conversation data, and raw user audio.
          required: true
